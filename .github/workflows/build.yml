name: Build Platform Registry

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod

      manifest:
        description: CI manifest file
        required: false
        default: gitops/state
        type: string

      registry:
        description: Platform registry root directory
        required: false
        default: gitops/registry
        type: string

  workflow_call:
    inputs:
      env:
        description: Target environment
        required: true
        type: string

      manifest:
        description: CI manifest file
        required: false
        default: gitops/state
        type: string

      registry:
        description: Platform registry root directory
        required: false
        default: gitops/registry
        type: string

permissions:
  contents: write
  actions: read

jobs:
  platform_build:
    runs-on: ubuntu-latest

    env:
      ENV: ${{ inputs.env }}
      MANIFEST: ${{ inputs.manifest }}
      REGISTRY: ${{ inputs.registry }}
      RUN_ID: "${{ github.run_id }}"
      WORKFLOW_ID: "${{ github.workflow }}"

    steps:
      - name: Checkout KubApp
        uses: actions/checkout@v4

      - name: Build platform App registry
        run: |
          python scripts/platform/build_app_registry.py

      - name: Build platform Service registry
        run: |
          python scripts/platform/build_service_registry.py

      - name: Validate platform registry
        run: |
          python scripts/platform/validate_registry.py

      - name: Save Platform State For Downwards
        run: |
         python scripts/platform/create_latest_state.py

      - name: Commit platform registry
        run: |
          set -euo pipefail
          DIR="gitops"
          MSG="[PLATFORM-BUILD] Update platform registry from CI"
          bash scripts/extra/commit.sh "$DIR" "$MSG"

      - name: Platform build complete
        run: echo "Platform registry build completed successfully"
