name: Argocd Cluster Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to confirm cluster cleanup"
        required: true
        default: "NO"
  workflow_call:
    inputs:
      env:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cluster-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Safety confirmation
        run: |
          set -euo pipefail
          CONFIRM="${{ github.event.inputs.confirm }}"
          CONFIRM="${CONFIRM,,}"
          if [[ "$CONFIRM" != "yes" ]]; then
            echo "❌ Cleanup aborted. You must type YES to proceed."
            exit 1
          fi

          echo "⚠️ CLEANUP CONFIRMED — PROCEEDING"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check AWS credentials
        run: aws sts get-caller-identity

      - name: Setup kubeconfig
        run: |
          set -e

          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name kubapp-dev

          export KUBECONFIG=~/.kube/config

          echo "✅ kubeconfig created"

          kubectl cluster-info

      - name: Check
        run: |
          set -e
          echo "=== kubeconfig ==="
          cat ~/.kube/config || true
          echo "=== auth test ==="
          kubectl auth can-i get pods -A || true

      - name: Install kubectl
        run: |
          set -euo pipefail

          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure Kubernetes access
        run: |
          set -euo pipefail

          echo "Configure kubeconfig here if needed"
          kubectl version --client

      - name: Extract Terraform-managed Namespaces
        run: |
          TF_CREATED_NS=$(terraform output -json namespaces 2>/dev/null || true)
          if [[ -z "$TF_CREATED_NS" || "$TF_CREATED_NS" == "null" ]]; then
            echo "No Terraform-managed namespaces Extracted"
          fi
          echo "TF_CREATED_NS=$TF_CREATED_NS" >> "$GITHUB_ENV"

      - name: Install jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run cluster cleanup
        env:
          TF_CREATED_NS: ${{ env.TF_CREATED_NS }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          bash scripts/gitops/clean_cluster.sh

      - name: Verify cluster state after cleanup
        run: |
          set -euo pipefail

          echo "Checking remaining resources..."

          kubectl get ns
          kubectl get ingress -A || true
          kubectl get applicationsets -n argocd || true

          echo "✅ Cleanup verification completed"

