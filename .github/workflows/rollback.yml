name: Rollback

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to rollback"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

      mode:
        description: "Rollback mode"
        required: true
        default: target
        type: choice
        options:
          - target
          - full

  workflow_call:
    inputs:
      env:
        required: true
        type: string

      mode:
        required: false
        default: target
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.KUBAPP_WORKFLOW_PAT || github.token }}

      - name: Find latest stable deployment and rollback
        env:
          ENV: ${{ inputs.env }}
          MODE: ${{ inputs.mode || 'target' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "======================================"
          echo "ROLLBACK"
          echo "======================================"
          echo "Environment: $ENV"
          echo "Mode:        $MODE"
          echo ""

          if [[ "$ENV" != "dev" && "$ENV" != "prod" ]]; then
            echo "❌ Invalid environment: $ENV"
            exit 1
          fi

          if [[ "$MODE" != "target" && "$MODE" != "full" ]]; then
            echo "❌ Invalid rollback mode: $MODE"
            exit 1
          fi

          git fetch origin main --tags

          # Select the latest stable tag for this environment.
          TAG=$(git tag --list "stable-${ENV}-*" | sort -r | head -n 1)

          if [[ -z "$TAG" ]]; then
            echo "❌ No stable deployment tag found for environment: $ENV"
            exit 1
          fi

          COMMIT=$(git rev-list -n 1 "$TAG")

          if [[ -z "$COMMIT" ]] || ! git cat-file -e "${COMMIT}^{commit}" 2>/dev/null; then
            echo "❌ Stable tag does not point to a valid commit: $TAG"
            exit 1
          fi

          echo "✅ Stable deployment found"
          echo "Stable tag:    $TAG"
          echo "Stable commit: $COMMIT"
          echo ""

          git checkout -B main origin/main

          if [[ "$MODE" == "target" ]]; then

            echo "Applying TARGET rollback..."
            echo "Restoring GitOps files while preserving stable deployment records."

            BACKUP_DIR=$(mktemp -d)
            STABLE_DEPLOYS="gitops/state/stable_deploys"

            if [[ -d "$STABLE_DEPLOYS" ]]; then
              cp -a "$STABLE_DEPLOYS" "$BACKUP_DIR/stable_deploys"
              HAS_STABLE_DEPLOYS=true
            else
              HAS_STABLE_DEPLOYS=false
            fi

            # Restore GitOps state from the selected stable commit.
            git restore --source="$COMMIT" -- gitops

            # Restore stable deployment records so the rollback
            # cannot delete records created after the stable commit.
            if [[ "$HAS_STABLE_DEPLOYS" == "true" ]]; then
              mkdir -p "$(dirname "$STABLE_DEPLOYS")"
              rm -rf "$STABLE_DEPLOYS"
              cp -a "$BACKUP_DIR/stable_deploys" "$STABLE_DEPLOYS"
            fi

            rm -rf "$BACKUP_DIR"

            git add gitops

            if git diff --cached --quiet; then
              echo "✅ GitOps state already matches the selected stable deployment."
              echo "Stable deployment records remain preserved."
              exit 0
            fi

            git status --short
            git diff --cached --stat

            git commit \
              -m "[ROLLBACK] Restore $ENV to stable $TAG"

            git push origin HEAD:main

            echo ""
            echo "✅ Target rollback applied successfully."
            echo "Environment:   $ENV"
            echo "Stable tag:    $TAG"
            echo "Stable commit: $COMMIT"
            echo "Stable deployment records preserved."

          elif [[ "$MODE" == "full" ]]; then

            echo "Applying FULL rollback..."
            echo "WARNING: This rewrites main history and may remove newer stable deployment records from the branch."

            git reset --hard "$COMMIT"

            git push origin main --force-with-lease

            echo ""
            echo "✅ Full rollback completed."
            echo "Environment: $ENV"
            echo "Stable tag:  $TAG"
            echo "Main now points to: $COMMIT"

          fi
