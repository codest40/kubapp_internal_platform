name: Rollback

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to rollback"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

      tag:
        description: "Stable deployment tag to rollback to"
        required: true
        type: string

      mode:
        description: "Rollback mode"
        required: true
        default: target
        type: choice
        options:
          - target
          - full

  workflow_call:
    inputs:
      env:
        required: true
        type: string

      commit:
        required: true
        type: string

      tag:
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rollback to stable deployment
        env:
          ENV: ${{ inputs.env }}
          COMMIT: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "======================================"
          echo "ROLLBACK"
          echo "======================================"
          echo "Environment: $ENV"
          echo "Stable tag:  $TAG"
          echo "Stable commit: $COMMIT"
          echo ""
          git fetch origin main --tags

          if ! git cat-file -e "${COMMIT}^{commit}" 2>/dev/null; then
            echo "❌ Stable commit does not exist: $COMMIT"
            exit 1
          fi

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Stable tag does not exist: $TAG"
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "$TAG")

          if [[ "$TAG_COMMIT" != "$COMMIT" ]]; then
            echo "❌ Stable tag does not point to supplied commit"
            echo "Tag commit:      $TAG_COMMIT"
            echo "Expected commit: $COMMIT"
            exit 1
          fi

          echo "✅ Stable tag verified"
          echo "Tag points to commit: $COMMIT"
          echo ""

          MODE="${{ inputs.mode || 'target' }}"

          if [[ "$MODE" == "target" ]]; then

            echo "Applying TARGET rollback..."
            echo "Restoring GitOps state from stable commit"

            # Restore the complete GitOps state represented by
            # the stable deployment commit.
            git restore --source="$COMMIT" -- gitops
            git add gitops
            if git diff --cached --quiet; then
              echo "✅ Current GitOps state already matches stable commit"
              exit 0
            fi

            git status --short

            git commit \
              -m "[ROLLBACK] Restore $ENV to stable $TAG"

            git push origin HEAD:main

            echo ""
            echo "✅ Target rollback applied successfully"
            echo "Stable commit: $COMMIT"
            echo "Stable tag:    $TAG"

          elif [[ "$MODE" == "full" ]]; then

            echo "Applying FULL rollback..."
            echo "WARNING: This rewrites main history"

            git fetch origin main
            git checkout main
            git reset --hard "$COMMIT"

            git push origin main --force-with-lease

            echo ""
            echo "✅ Full rollback completed"
            echo "Main now points to: $COMMIT"

          else
            echo "❌ Invalid rollback mode: $MODE"
            exit 1
          fi
