name: Promote Commit as Stable

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact commit SHA confirmed as stable"
        required: true
        type: string

      env:
        description: "Environment for stable commit"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write

concurrency:
  group: stable-promotion-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate commit
        id: validate
        run: |
          set -euo pipefail

          COMMIT="${{ inputs.commit }}"

          if [[ ! "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "❌ Commit must be a full 40-character SHA"
            exit 1
          fi

          git fetch origin "$COMMIT"
          if ! git cat-file -e "${COMMIT}^{commit}" 2>/dev/null; then
            echo "❌ Commit does not exist: $COMMIT"
            exit 1
          fi

          echo "✅ Commit exists: $COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Validate environment
        id: env
        run: |
          set -euo pipefail

          ENV="${{ inputs.env }}"
          if [[ "$ENV" != "dev" && "$ENV" != "prod" ]]; then
            echo "❌ Invalid environment: $ENV"
            exit 1
          fi

          echo "Environment: $ENV"
          echo "env=$ENV" >> "$GITHUB_OUTPUT"

      - name: Show selected commit
        run: |
          set -euo pipefail

          COMMIT="${{ steps.validate.outputs.commit }}"
          ENV="${{ steps.env.outputs.env }}"

          echo "======================================"
          echo "SELECTED STABLE COMMIT"
          echo "======================================"

          git show --no-patch --format=fuller "$COMMIT"

          echo ""
          echo "Environment: $ENV"

      - name: Create stable tag
        id: stable_tag
        run: |
          set -euo pipefail

          COMMIT="${{ steps.validate.outputs.commit }}"
          ENV="${{ steps.env.outputs.env }}"

          SHORT_SHA=$(git rev-parse --short "$COMMIT")
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          TAG="stable-${ENV}-${TIMESTAMP}-${SHORT_SHA}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag already exists: $TAG"
            exit 1
          fi

          git tag -a "$TAG" "$COMMIT" \
            -m "Stable deployment: ${ENV} | Commit=${COMMIT}"

          git push origin "$TAG"

          echo "======================================"
          echo "STABLE TAG CREATED"
          echo "======================================"
          echo "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create stable deployment state
        env:
          COMMIT: ${{ steps.validate.outputs.commit }}
          ENV: ${{ steps.env.outputs.env }}
          TAG: ${{ steps.stable_tag.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p gitops/state

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          FILE="gitops/state/stable-deploy-${ENV}-${TIMESTAMP}.json"
          jq -n \
            --arg env "$ENV" \
            --arg commit "$COMMIT" \
            --arg tag "$TAG" \
            --arg timestamp "$TIMESTAMP" \
            '{
              env: $env,
              commit: $commit,
              stable_tag: $tag,
              timestamp: $timestamp
            }' > "$FILE"

          echo "======================================"
          echo "STABLE DEPLOYMENT"
          echo "======================================"

          echo "FILE=$FILE" >> "$GITHUB_ENV"
          cat "$FILE"

      - name: Commit stable state
        run: |
          set -euo pipefail

          FILE="${{ env.FILE }}"
          bash scripts/extra/commit.sh \
            "$FILE" \
            "[STABLE] Promote ${{ steps.validate.outputs.commit }} as stable"
          echo "✅ Stable deployment recorded"

