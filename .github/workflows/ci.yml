name: Activate Continuous Integration

on:
  #push: {}
  workflow_call:
    inputs:
      env:
        required: true
        type: string
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true

  workflow_dispatch:
    inputs:
      env:
        description: Env mode
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod
      mode:
        description: Strict Validation Mode
        required: false
        default: true
        type: choice
        options:
          - false
          - true
      fail_mode:
        description: Build failure Terminate
        required: false
        default: true
        type: choice
        options:
          - false
          - true

permissions:
  contents: write

jobs:
  start_ci:
    runs-on: ubuntu-latest
    env:
        ENV: ${{ inputs.env || 'dev' }}
        STRICT_MODE: ${{ inputs.mode || 'true' }}
        FAIL_MODE: ${{ inputs.fail_mode || 'true' }}

    steps:
      - name: Source code checkout
        uses: actions/checkout@v4

      - name: Show this commit
        run: |
          echo "Commit ID: ${{ github.sha }}"

      - name: Check Python
        run: bash scripts/ci/check_python.sh

      - name: Setup SOPS and Age Key
        run: |
          set -euo pipefail
          curl -L -o sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          chmod +x sops
          sudo mv sops /usr/local/bin/sops

          mkdir -p ~/.config/sops/age
          echo "${{ secrets.AGE_PRIVATE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          test -s ~/.config/sops/age/keys.txt || {
            echo "❌ AGE key missing"
            exit 1
          }

      - name: Call Dependency Abstractor
        run: python scripts/ci/dependency_abstractor.py
        env:
            NVD_API_KEY: "${{ secrets.NVD_API_KEY }}"
            DOCKER_USER: "${{ secrets.DOCKER_USER }}"
            DOCKER_PASS: "${{ secrets.DOCKER_PASS }}"
            STRICT_MODE: "${{ env.STRICT_MODE }}"
            FAIL_MODE: "${{ env.FAIL_MODE }}"
            ENV: "${{ env.ENV }}"

      - name: Commit App Build + Push
        run: |
          set -euo pipefail
          ENV="${{ env.ENV }}"
          echo "Current ENV: $ENV"
          DIR1="docker"
          DIR2="gitops"
          MSG="[APP-BUILD-PUSH] Updated App Build + Push Registry from CI"
          bash scripts/extra/commit.sh "$DIR1" "$DIR2" "$MSG"

      - name: Completion
        run: echo "Successfully completed CI workflow!"
