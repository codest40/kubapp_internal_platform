name: Deploy sys_monitor

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: sys-monitor-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Switch to sys_monitor AWS account
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          SYS_MONITOR_ACCOUNT_ID: ${{ vars.SYS_MONITOR_ACCOUNT_ID }}
        run: |
          chmod +x sys_monitor/cloud/aws/switch_account.sh
          ./sys_monitor/cloud/aws/switch_account.sh

      - name: Verify active AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup AGE key
        run: |
          if ! command -v sops >/dev/null 2>&1; then
            curl -L -o sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
            chmod +x sops
            sudo mv sops /usr/local/bin/sops
          fi
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.AGE_PRIVATE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Retrieve EC2 instance ID
        id: instance
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          INSTANCE_ID=$(bash sys_monitor/cloud/aws/runner.sh instance-id) || {
                echo "❌ DB OUTPUTS Not Retrieved from terraform"
                exit 1
            }
          INSTANCE_ID="$(printf '%s\n' "$INSTANCE_ID" | tail -n 1 | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [[ ! "$INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]; then
              echo "ERROR: Invalid EC2 instance ID: $INSTANCE_ID"
          fi
          echo "SYS_MONITOR_INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Retrieved instance: $INSTANCE_ID"

      - name: Deploy through SSM
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: "${{ env.SYS_MONITOR_INSTANCE_ID }}"
        run: |
          set -euo pipefail

          REPO_DIR="/opt/sys_monitor"
          APP_DIR="$REPO_DIR/sys_monitor"

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -euo pipefail

          export HOME=/root
          # Configure GitHub SSH authentication
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/sys_monitor_deploy -o IdentitiesOnly=yes"

          echo "Deployment execution identity:"
          whoami
          echo "HOME=$HOME"

          REPO_DIR="/opt/sys_monitor"
          APP_DIR="$REPO_DIR/sys_monitor"

          echo "Starting sys_monitor deployment..."

          # Update repository to the latest main commit
          git -C "$REPO_DIR" fetch origin main
          git -C "$REPO_DIR" checkout main
          git -C "$REPO_DIR" reset --hard origin/main

          echo "Deployed commit:"
          git -C "$REPO_DIR" rev-parse HEAD

          cd "$APP_DIR"

          echo "Validating Docker Compose configuration..."
          docker compose config --quiet

          echo "Building and deploying services..."
          docker compose up -d --build --remove-orphans

          echo "Checking deployed containers..."
          docker compose ps

          echo "Deployment completed."
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy sys_monitor from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to finish..."

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json

                exit 1
                ;;
            esac

            if [ "$attempt" -eq 180 ]; then
              echo "Deployment timed out waiting for SSM."
              exit 1
            fi

            sleep 10
          done

          echo "Deployment output:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
