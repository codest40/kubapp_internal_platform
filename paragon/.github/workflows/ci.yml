name: Activate Continuous Integration

on:
  #push: {}
  workflow_call:
    inputs:
      env:
        required: true
        type: string
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASS:
        required: true

  workflow_dispatch:
    inputs:
      env:
        description: Env mode
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: write

jobs:
  start_ci:
    runs-on: ubuntu-latest
    env:
        ENV: ${{ inputs.env || 'dev' }}

    steps:
      - name: Source code checkout
        uses: actions/checkout@v4

      - name: Show this commit
        run: |
          echo "Commit ID: ${{ github.sha }}"

      - name: Check Python
        run: bash scripts/ci/check_python.sh

      - name: Call Dependency Abstractor
        run: python scripts/ci/dependency_abstractor.py
        env:
            NVD_API_KEY: "${{ secrets.NVD_API_KEY }}"
            DOCKER_USER: "${{ secrets.DOCKER_USER }}"
            DOCKER_PASS: "${{ secrets.DOCKER_PASS }}"
            ENV: "${{ env.ENV }}"

      - name: Commit App Build + Push
        run: |
          set -euo pipefail
          ENV="${{ env.ENV }}"
          echo "Current ENV: $ENV"
          DIR1="docker"
          DIR2="gitops"
          MSG="[APP-BUILD-PUSH] Updated App Build + Push Registry from CI"
          bash scripts/extra/commit.sh "$DIR1" "$DIR2" "$MSG"

      - name: Completion
        run: echo "Successfully completed CI workflow!"
