appName: kubwatch
namespace: dev
serviceAccount:
  create: true
  name: kubwatch-sa
  roleArn: arn:aws:iam::259183055744:role/kubapp-dev-app-pods-role
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
replicaCount: 2
image:
  repository: paragon40/kubwatch_app
  tag: 03b9de8d92-2026-10-16-14-13-31
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
env: {}
securityContext:
  pod:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  container:
    runAsNonRoot: true
    runAsUser: 10006
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
probes:
  readiness:
    httpGet:
      path: /health/
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /health/
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  cpu: 70
  memory: 70
meta:
  staticFingerprint: 50645e15ae6fcca224f5ab876f1061091650a309495c4b48d193a5527ab78ef3
  generatedAt: 2026-10-16T14:17:50Z
  source: build-pipeline
storage:
  volumes:
    - name: kubwatch-vol
      emptyDir: {}
  volumeMounts:
    - name: kubwatch-vol
      mountPath: /tmp
secret:
  enabled: true
  name: kubwatch-secrets
db:
  enabled: true
  secretName: kubwatch-db-secrets
labels:
  compute: fargate
