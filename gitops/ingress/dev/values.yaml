namespace: dev
ingress:
  name: kubapp-dev-alb
  className: alb
  baseDomain: rundailytest.online
  enableSubdomainRouting: true
  certificateArn: arn:aws:acm:us-east-1:259183055744:certificate/846e1fa2-069f-4d21-a679-e40efc282d60
  annotations:
    scheme: internet-facing
    targetType: ip
    healthcheckPath: /
    listenPorts:
      - HTTP: 80
      - HTTPS: 443
    group: kubapp-shared
services:
  - name: python-cicd
    enabled: true
    port: 80
  - name: node-db-order-app
    enabled: true
    port: 80
  - name: kubwatch
    enabled: true
    port: 80
