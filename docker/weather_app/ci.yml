runtime: python

ci_commands:
  lint:
    - python
    - -m
    - ruff
    - check
    - .

  security:
    - python
    - -m
    - bandit
    - -r
    - .

  security_env: []

  test:
    - python
    - -m
    - pytest



extra_ci_config:
  healthcheck:
    app_port: 8000
    host_port: 8000
    endpoints:
      - /health
    expected_status: 200
